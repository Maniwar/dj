name: Generate AtlasCloud videos

# Renders scene videos on a GitHub runner, which (unlike some dev environments) can reach
# api.atlascloud.ai. The runner generates, downloads, compresses to silent 720p and commits the
# results back to main — which in turn triggers the Pages deploy, so new clips go live on their own.
#
# COSTS CREDITS. Manual trigger only, and `filter` defaults to Jussi's clips so an accidental run
# renders two scenes rather than every scene in the file.
#
# Requires one repository secret: ATLASCLOUD_API_KEY  (Settings -> Secrets and variables -> Actions)

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Comma-separated clip id substrings (e.g. "lore-jussi,lore-tampere"). Use "ALL" to render every clip — expensive.'
        required: true
        default: 'lore-jussi,lore-tampere'
      mode:
        description: 'render = submit new clips (costs credits). resume = only collect renders already submitted (free).'
        type: choice
        options: [render, resume]
        required: true
        default: 'render'
      commit:
        description: 'Commit the generated videos back to main'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

# Never let two render jobs write results.json at once.
concurrency:
  group: generate-videos
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the API key is present
        env:
          ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
        run: |
          if [ -z "$ATLASCLOUD_API_KEY" ]; then
            echo "::error::Repository secret ATLASCLOUD_API_KEY is not set."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "key present (${#ATLASCLOUD_API_KEY} chars)"

      - name: Install ffmpeg
        # NOT preinstalled on ubuntu-24.04 runners. Both the audio cutter and the 720p encoder
        # need it, and without it they failed per-file and still exited 0 — a green step that
        # produced nothing.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Cut any missing 10s audio excerpts
        # Seedance caps conditioning audio at ~30s, so each clip needs a short excerpt rather
        # than the full track.
        run: node scripts/make-audio-clips.mjs

      - name: Collect any renders already submitted (free — no new credits)
        env:
          atlascloudapikey: ${{ secrets.ATLASCLOUD_API_KEY }}
        run: node scripts/resume-videos.mjs

      - name: Render clips
        if: ${{ inputs.mode == 'render' }}
        env:
          # the scripts read this lowercase name
          atlascloudapikey: ${{ secrets.ATLASCLOUD_API_KEY }}
          GEN_CONCURRENCY: '2'
        run: |
          FILTER='${{ inputs.filter }}'
          if [ "$FILTER" = "ALL" ]; then
            echo "Rendering ALL clips"
            node scripts/gen-atlascloud-videos.mjs
          else
            echo "Rendering clips matching: $FILTER"
            node scripts/gen-atlascloud-videos.mjs "$FILTER"
          fi

      - name: Download masters and build the 720p rendition
        env:
          atlascloudapikey: ${{ secrets.ATLASCLOUD_API_KEY }}
        run: node scripts/localize-videos.mjs

      - name: Build the 1080p (hd) rendition
        # videoRendition.ts swaps /assets/video/ -> /assets/video/hd/ by display width with NO
        # 404 fallback, so a clip shipping only 720p is a BROKEN video on any wide screen.
        run: node scripts/build-video-renditions.mjs

      - name: Every ready clip must ship BOTH renditions
        run: |
          node -e "
            const fs = require('fs');
            const r = require('./src/data/atlascloud.results.json');
            const missing = [];
            for (const c of r.clips.filter(c => c.status === 'ready')) {
              const sd = 'public/assets/video/' + c.id + '.mp4';
              const hd = 'public/assets/video/hd/' + c.id + '.mp4';
              if (!fs.existsSync(sd)) missing.push(c.id + ' (720p)');
              if (!fs.existsSync(hd)) missing.push(c.id + ' (1080p/hd)');
            }
            for (const m of missing) console.error('::error::missing rendition: ' + m);
            console.log(r.clips.filter(c=>c.status==='ready').length + ' ready clip(s); ' + missing.length + ' missing rendition file(s)');
            if (missing.length) process.exit(1);
          "

      - name: Show what changed
        run: |
          node -e "const r=require('./src/data/atlascloud.results.json');console.log(r.clips.length+' clips, '+r.clips.filter(c=>c.status==='ready').length+' ready');console.log(r.clips.map(c=>' - '+c.id+' '+c.status+' '+(c.mp4Url||'')).join('\n'))"
          git --no-pager diff --stat

      - name: Verify the site still builds with the new manifest
        run: npm run build

      - name: Commit results
        if: ${{ inputs.commit }}
        run: |
          rm -rf .video-tmp
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/atlascloud.results.json public/assets/video public/assets/video/hd public/mp3-clips scripts/video-masters.manifest.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Render AtlasCloud clips (filter: ${{ inputs.filter }})"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail if any targeted clip did not render
        # The generator catches per-clip errors so one failure cannot abort the batch — which
        # means it exits 0 even when nothing rendered, and the run goes green having produced
        # no video. This turns that back into an honest red, and runs AFTER the commit so any
        # clip that DID render is still saved.
        run: |
          node -e "
            const r = require('./src/data/atlascloud.results.json');
            const raw = process.env.FILTER;
            const terms = raw === 'ALL' ? null : raw.split(',').map(s=>s.trim()).filter(Boolean);
            const targeted = terms ? r.clips.filter(c => terms.some(t => c.id.includes(t))) : r.clips;
            const bad = targeted.filter(c => c.status !== 'ready');
            for (const c of bad) console.error('::error::' + c.id + ' — ' + String(c.error||'').replace(/\n/g,' ').slice(0,300));
            if (!targeted.length) { console.error('::error::filter matched no clips: ' + raw); process.exit(1); }
            console.log(targeted.length - bad.length + '/' + targeted.length + ' targeted clip(s) ready');
            if (bad.length) process.exit(1);
          "
        env:
          FILTER: ${{ inputs.filter }}

      - name: Upload clips as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-clips
          path: |
            public/assets/video/*.mp4
            src/data/atlascloud.results.json
          if-no-files-found: warn
          retention-days: 14
