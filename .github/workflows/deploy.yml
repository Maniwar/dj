name: Deploy to GitHub Pages

# Builds the Vite site and publishes /dist to GitHub Pages on every push to main.
#
# The site is served from the CUSTOM APEX DOMAIN club-humidity.com, which serves from the
# ROOT — so the base path is "/" and NOT the old "/dj/" project subpath. Building with /dj/
# against a root domain makes every asset URL resolve to /dj/assets/... and 404, which is a
# blank page rather than an obvious error. public/CNAME carries the domain into the artifact
# so it survives every deploy (the Pages setting alone is easy to lose on reconfiguration).
# If the custom domain is ever removed, this must go back to BASE_PATH=/dj/.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token that can publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress production deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Build (custom domain, served from root)
        run: npm run build
        env:
          BASE_PATH: /
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
